name: ratchet-completion-a
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ratchet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RATCHET_MIGRATOR_PASSWORD: ${RATCHET_MIGRATOR_PASSWORD:-migrator}
      RATCHET_RUNTIME_PASSWORD: ${RATCHET_RUNTIME_PASSWORD:-runtime}
      RATCHET_PROJECTOR_PASSWORD: ${RATCHET_PROJECTOR_PASSWORD:-projector}
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - completion-a-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d ratchet]
      interval: 2s
      timeout: 3s
      retries: 30
  authority:
    build:
      context: ..
      dockerfile: deploy/prototype.Dockerfile
      target: runtime
    environment:
      RATCHET_AUTHORITY_DSN: postgres://ratchet_runtime:${RATCHET_RUNTIME_PASSWORD:-runtime}@postgres:5432/ratchet?sslmode=disable
      RATCHET_AUTHORITY_MIGRATION_DSN: postgres://ratchet_migrator:${RATCHET_MIGRATOR_PASSWORD:-migrator}@postgres:5432/ratchet?sslmode=disable
    ports:
      - "127.0.0.1:8445:8445"
    depends_on:
      postgres:
        condition: service_healthy
    command: [ratchet-authority, --listen, "0.0.0.0:8445"]
volumes:
  completion-a-postgres:
