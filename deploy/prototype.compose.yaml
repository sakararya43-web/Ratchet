name: ratchet-prototype
x-runtime: &runtime
  image: ratchet-prototype:local
  network_mode: service:nats
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
x-runtime-env: &runtime-env
  RATCHET_DATABASE_DSN: postgres://ratchet_runtime:${RATCHET_RUNTIME_PASSWORD}@postgres:5432/ratchet?sslmode=disable
services:
  postgres:
    image: ratchet-prototype-db:local
    environment:
      POSTGRES_DB: ratchet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?private prototype env required}
      RATCHET_MIGRATOR_PASSWORD: ${RATCHET_MIGRATOR_PASSWORD:?private prototype env required}
      RATCHET_RUNTIME_PASSWORD: ${RATCHET_RUNTIME_PASSWORD:?private prototype env required}
      RATCHET_PROJECTOR_PASSWORD: ${RATCHET_PROJECTOR_PASSWORD:?private prototype env required}
    volumes: [prototype-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d ratchet]
      interval: 2s
      timeout: 3s
      retries: 60
  nats:
    image: nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    command: [--jetstream, --store_dir=/data]
    volumes: [prototype-nats:/data]
    ports: ["127.0.0.1:8444:8444", "127.0.0.1:58085:8085"]
  operator:
    <<: *runtime
    profiles: [operator]
    environment:
      RATCHET_MIGRATION_DSN: postgres://ratchet_migrator:${RATCHET_MIGRATOR_PASSWORD}@postgres:5432/ratchet?sslmode=disable
    volumes: [prototype-core:/data/core, prototype-edge:/data/edge, prototype-operator:/data/operator]
    command: [ratchet-prototype, init]
  simulator:
    <<: *runtime
    environment:
      SIM_BROKER_TOKEN: ${SIM_BROKER_TOKEN:?private prototype env required}
    volumes: [prototype-simulator:/data/simulator]
    command: [ratchet-sim, --port, '8085', --state, /data/simulator/state.json]
  graph:
    <<: *runtime
    environment: *runtime-env
    volumes: [prototype-core:/data/core:ro]
    command: [ratchetd, graph-serve, --config, /data/core/graph.json, --listen, '127.0.0.1:8443']
  core:
    <<: *runtime
    environment: *runtime-env
    volumes: [prototype-core:/data/core:ro]
    command: [ratchetd, console-serve, --config, /data/core/console.json, --listen, '0.0.0.0:8444']
    healthcheck:
      test: [CMD, ratchet-prototype, health]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s
  connector:
    <<: *runtime
    environment:
      SIM_BROKER_TOKEN: ${SIM_BROKER_TOKEN:?private prototype env required}
    volumes: [prototype-edge:/data/edge]
    command: [ratchet-connector, --target, 'http://127.0.0.1:8085', --nats, 'nats://127.0.0.1:4222', --key, /data/edge/signing.key, --cursor, /data/edge/cursor.json, --core-key, /data/edge/core.pub, --state, /data/edge/commands, --health-listen, '127.0.0.1:8086']
    healthcheck:
      test: [CMD, ratchet-prototype, health, --url, 'http://127.0.0.1:8086/readyz']
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  prototype-postgres:
  prototype-nats:
  prototype-core:
  prototype-edge:
  prototype-operator:
  prototype-simulator:
