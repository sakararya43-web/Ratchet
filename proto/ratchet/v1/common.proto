syntax = "proto3";

package ratchet.v1;

option go_package = "github.com/sakararya43-web/Ratchet/proto/ratchet/v1;ratchetv1";

// Unknown kinds and all zero enum values are invalid commands.
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ROLE_ASSIGN = 1;
  CHANGE_KIND_ROLE_REVOKE = 2;
  CHANGE_KIND_CREATE_ACCOUNT = 3;
  CHANGE_KIND_GRANT_PERMISSION = 4;
  CHANGE_KIND_REVOKE_PERMISSION = 5;
  CHANGE_KIND_CHANGE_APPROVER = 6;
  CHANGE_KIND_MODIFY_SAFEGUARD = 7;
  CHANGE_KIND_RESTRICT_ACCOUNT = 8;
  CHANGE_KIND_TERMINATE_SESSION = 9;
}

enum ChangeState {
  CHANGE_STATE_UNSPECIFIED = 0;
  CHANGE_STATE_SUBMITTED = 1;
  CHANGE_STATE_ASSESSED = 2;
  CHANGE_STATE_ALLOWED = 3;
  CHANGE_STATE_AWAITING_APPROVAL = 4;
  CHANGE_STATE_HELD = 5;
  CHANGE_STATE_REJECTED = 6;
  CHANGE_STATE_APPROVED = 7;
  CHANGE_STATE_EXECUTING = 8;
  CHANGE_STATE_EXECUTED = 9;
  CHANGE_STATE_FAILED = 10;
  CHANGE_STATE_EXPIRED = 11;
  CHANGE_STATE_REVOKED = 12;
}

enum DecisionOutcome {
  DECISION_OUTCOME_UNSPECIFIED = 0;
  DECISION_OUTCOME_ALLOW = 1;
  DECISION_OUTCOME_REQUIRE_APPROVAL = 2;
  DECISION_OUTCOME_HOLD = 3;
  DECISION_OUTCOME_REJECT = 4;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_INPUT = 1;
  ERROR_REASON_IDENTITY_MISMATCH = 2;
  ERROR_REASON_VERSION_CONFLICT = 3;
  ERROR_REASON_IDEMPOTENCY_CONFLICT = 4;
  ERROR_REASON_CONTEXT_CHANGED = 5;
  ERROR_REASON_STALE_GRAPH = 6;
  ERROR_REASON_DEPENDENCY_UNAVAILABLE = 7;
  ERROR_REASON_INDEPENDENCE_VIOLATION = 8;
  ERROR_REASON_QUORUM_NOT_MET = 9;
  ERROR_REASON_UNSUPPORTED_SCHEMA = 10;
}

// Transport authentication, never these fields, establishes actor and tenant.
message MutationContext {
  string idempotency_key = 1;
  int64 expected_revision = 2;
  string correlation_id = 3;
  int64 min_graph_version = 4;
}

message ErrorDetail {
  ErrorReason reason = 1;
  int64 actual_revision = 2;
  int64 actual_graph_version = 3;
  string correlation_id = 4;
}

// Signed intent excludes personal justification text; the private record is bound.
message ExactChangeIntent {
  ChangeKind kind = 1;
  string target_identity = 2;
  string requested_access = 3;
  repeated string requested_resources = 4;
  repeated string requested_permissions = 5;
  bool emergency = 6;
  int64 time_limit_seconds = 7;
  string incident_id = 8;
  string private_record_reference = 9;
  string private_content_digest = 10;
  map<string, string> safeguard_parameters = 11;
}

message ApprovalEnvelope {
  uint32 format_version = 1;
  string tenant_id = 2;
  string request_id = 3;
  int64 request_revision = 4;
  string authenticated_requester = 5;
  ExactChangeIntent intent = 6;
  int64 graph_version = 7;
  string impact_digest = 8;
  string policy_bundle_hash = 9;
  string expires_at = 10;
}

// Additive metadata on existing connector messages; IDs survive every redelivery.
message ConnectorEnvelope {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string connector_id = 3;
  string message_id = 4;
  string correlation_id = 5;
  string command_id = 6;
  int64 source_revision = 7;
}

message WatchCursor {
  string after_cursor = 1;
}
