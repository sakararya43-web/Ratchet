syntax = "proto3";

package ratchet.v1;

import "ratchet/v1/common.proto";

option go_package = "github.com/sakararya43-web/Ratchet/proto/ratchet/v1;ratchetv1";

message GraphNode {
  string id = 1;
  string type = 2; // Human, ServiceAccount, Group, Role, Permission, Resource, Safeguard, Session
  int32 tier = 3; // Criticality tier 0-3
  string display_name = 4;
  map<string, string> properties = 5;
}

message GraphEdge {
  string source = 1;
  string target = 2;
  string kind = 3; // MEMBER_OF, ASSIGNED, GRANTS, CAN_ASSUME, CAN_ADMINISTER, CAN_MODIFY, CAN_APPROVE, PROTECTED_BY
  string action = 4; // e.g. "read", "admin", "sign"
  map<string, string> properties = 5;
}

message GraphSnapshot {
  string tenant_id = 1;
  string connector_id = 2;
  int64 source_revision = 3;
  repeated GraphNode nodes = 4;
  repeated GraphEdge edges = 5;
  string timestamp = 6;
  ConnectorEnvelope envelope = 7;
  bool complete = 8;
}

message GraphDelta {
  string tenant_id = 1;
  string connector_id = 2;
  int64 from_revision = 3;
  int64 to_revision = 4;
  repeated GraphNode nodes_added = 5;
  repeated string nodes_removed = 6;
  repeated GraphEdge edges_added = 7;
  repeated GraphEdge edges_removed = 8;
  string timestamp = 9;
  ConnectorEnvelope envelope = 10;
}

message ExecCommand {
  string command_id = 1;
  string tenant_id = 2;
  string request_id = 3;
  string action = 4; // ASSIGN_ROLE, REVOKE_ROLE, TERMINATE_SESSION, RESTRICT_ACCOUNT, MODIFY_SAFEGUARD
  string target_identity = 5;
  string resource_or_role = 6;
  int64 expected_target_revision = 7;
  bool is_reduction = 8;
  string deadline = 9;
  ConnectorEnvelope envelope = 10;
  string approved_envelope_digest = 11;
  int64 graph_version = 12;
  string policy_bundle_hash = 13;
  string expected_state_digest = 14;
}

message ObservedState {
  string tenant_id = 1;
  string target_identity = 2;
  repeated string current_roles = 3;
  repeated string active_sessions = 4;
  bool is_restricted = 5;
  int64 observed_revision = 6;
  ConnectorEnvelope envelope = 7;
  string observed_at = 8;
  string state_digest = 9;
  string command_id = 10;
}

message ExecResult {
  string command_id = 1;
  string tenant_id = 2;
  string request_id = 3;
  bool success = 4;
  string error_message = 5;
  string applied_at = 6;
  int64 target_revision_after = 7;
  ObservedState observed_state = 8;
  ConnectorEnvelope envelope = 9;
  bool read_back_verified = 10;
}

message AuditEvent {
  string event_id = 1;
  string tenant_id = 2;
  string actor_id = 3;
  string action = 4;
  string target = 5;
  string timestamp = 6;
  string correlation_id = 7;
  map<string, string> details = 8;
  ConnectorEnvelope envelope = 9;
}

message DriftReport {
  string drift_id = 1;
  string tenant_id = 2;
  string connector_id = 3;
  AuditEvent unapproved_operation = 4;
  string detected_at = 5;
  string severity = 6;
  ConnectorEnvelope envelope = 7;
  int64 observed_revision = 8;
}

// Authentication wrapper for the actual DriftReport. The signature is over
// canonical proto JSON with signature empty, domain RATCHET_DRIFT_REPORT_V1.
message SignedDriftReport {
  DriftReport report = 1;
  bytes signature = 2;
}

// Separate envelope preserves the legacy signature's default-valued proto JSON.
message SignedKubernetesDriftReport {
  bytes signed_kubernetes_drift_json = 1; // RATCHET_KUBERNETES_DRIFT_V1, connector-pinned signature inside.
}

// Connector-authenticated sync; signature covers canonical proto JSON with this
// signature field empty. Trusted keys are pinned by tenant and connector.
message SignedGraphSync {
  ConnectorEnvelope envelope = 1;
  oneof payload {
    GraphSnapshot snapshot = 2;
    GraphDelta delta = 3;
    NormalizedKubernetesSnapshot kubernetes = 5;
  }
  bytes signature = 4;
}

// Core-owned normalized authority input; raw Kubernetes API parsing stays in
// the connector. The complete state uses the published domain/kubernetes JSON
// model, not arbitrary caller-supplied graph nodes/edges. The outer sync
// signature binds these bytes and all source metadata.
message NormalizedKubernetesSnapshot {
  string tenant_id = 1;
  string connector_id = 2;
  int64 source_revision = 3;
  bytes normalized_state_json = 4;
}
