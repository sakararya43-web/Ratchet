syntax = "proto3";

package ratchet.v1;

import "ratchet/v1/common.proto";

option go_package = "github.com/sakararya43-web/Ratchet/proto/ratchet/v1;ratchetv1";

service DecisionService {
  rpc Decide(DecisionRequest) returns (DecisionResponse);
}

message ChangeIntent {
  string tenant_id = 1;
  string kind = 2; // e.g. K8S_ROLEBINDING_CREATE, SIM_ROLE_ASSIGN
  string target_identity = 3;
  string requested_access = 4;
  string requested_by = 5;
  map<string, string> context = 6;
  ExactChangeIntent exact_intent = 7;
}

message DecisionRequest {
  ChangeIntent intent = 1;
  int64 min_graph_version = 2;
  string admission_request_id = 3;
  string exact_object_digest = 4; // Simulator: canonical ExactChangeIntent mapped to the core Intent digest.
  string target_revision = 5;
  string approved_request_id = 6;
}

message DecisionResponse {
  string outcome = 1; // ALLOW, REQUIRE_APPROVAL, HOLD, REJECT
  repeated string reasons = 2;
  repeated string required_approver_groups = 3;
  int32 required_quorum = 4;
  string policy_bundle_hash = 5;
  int64 graph_version = 6;
  DecisionOutcome typed_outcome = 7;
  string decision_id = 8;
  string exact_object_digest = 9;
  bool execution_authorized = 10; // One consumed staged command only; outcome alone never authorizes a write.
  string admission_request_id = 11;
  string target_revision = 12;
  string expires_at = 13;
  string policy_outcome = 14; // Policy result before the one-use execution binding is checked.
}
