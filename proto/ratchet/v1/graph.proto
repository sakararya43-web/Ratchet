syntax = "proto3";

package ratchet.v1;

option go_package = "github.com/sakararya43-web/Ratchet/proto/ratchet/v1;ratchetv1";

import "ratchet/v1/connector.proto";
import "ratchet/v1/impact.proto";

service GraphService {
  rpc GetNodeDetails(GetNodeDetailsRequest) returns (GetNodeDetailsResponse);
  rpc GetNeighbourhood(GetNeighbourhoodRequest) returns (GetNeighbourhoodResponse);
  rpc GetPathsToCritical(GetPathsToCriticalRequest) returns (GetPathsToCriticalResponse);
  rpc GetReach(GetReachRequest) returns (GetReachResponse);
}

message GetNodeDetailsRequest {
  string tenant_id = 1;
  string node_id = 2;
}

message GetNodeDetailsResponse {
  GraphNode node = 1;
  repeated GraphEdge incoming_edges = 2;
  repeated GraphEdge outgoing_edges = 3;
  int64 graph_version = 4;
}

message GetNeighbourhoodRequest {
  string tenant_id = 1;
  string node_id = 2;
  int32 depth = 3;
}

message GetNeighbourhoodResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  int64 graph_version = 3;
}

message GetPathsToCriticalRequest {
  string tenant_id = 1;
  string identity_id = 2;
  int32 max_paths = 3;
}

message GetPathsToCriticalResponse {
  repeated GraphRoute routes = 1;
  int64 graph_version = 2;
}

message GetReachRequest {
  string tenant_id = 1;
  string identity_id = 2;
}

message GetReachResponse {
  repeated GraphNode reachable_nodes = 1;
  repeated string controlled_identities = 2;
  map<string, int32> reach_by_tier = 3;
  int64 graph_version = 4;
}

